<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>号码查询系统</title>
    <style>
        /* 背景：使用更柔和的浅灰色，增加整体高级感 */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            min-height: 100vh; 
            margin: 0;
            padding-top: 100px;
            background-color: #f8fafe; 
        }

        /* 容器：加入平滑的圆角和多层阴影 */
        .search-container { 
            background: white; 
            padding: 40px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05), 0 4px 10px rgba(0,0,0,0.03); 
            text-align: center;
            transition: all 0.3s ease;
            width: fit-content;
        }

        h2 { 
            margin-top: 0;
            margin-bottom: 25px;
            color: #1a1a1a;
            font-size: 24px;
            letter-spacing: 1px;
        }

        /* 横向排列：使用 flex 布局并对齐 */
        .input-row {
            display: flex;
            align-items: center;
            gap: 10px; /* 输入框和按钮的间距 */
        }

        input { 
            padding: 12px 16px; 
            width: 260px; 
            border: 1.5px solid #e0e0e0; 
            border-radius: 8px; 
            outline: none; 
            font-size: 15px; 
            transition: border-color 0.2s;
        }

        /* 焦点状态：输入框变蓝色边框 */
        input:focus { 
            border-color: #007bff; 
        }

        button { 
            padding: 12px 24px; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 15px; 
            font-weight: 600;
            transition: all 0.2s;
            white-space: nowrap;
        }

        /* 悬停效果：按钮颜色加深并微提 */
        button:hover { 
            background: #0069d9; 
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0,123,255,0.3);
        }

        button:active {
            transform: translateY(0);
        }

        /* 结果框：增加平滑出现的动画 */
        .result { 
            margin-top: 25px; 
            padding: 15px; 
            border-radius: 8px; 
            display: none; 
            font-size: 15px;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ok { background: #e6f4ea; color: #1e7e34; border: 1px solid #d4edda; }
        .no { background: #feeff0; color: #d93025; border: 1px solid #f8d7da; }
    </style>
</head>
<body>

    <div class="search-container">
        <h2>号码查询系统</h2>
        <div class="input-row">
            <input type="text" id="phoneInput" placeholder="请输入手机号">
            <button onclick="checkPhone()">点击查询</button>
        </div>
        <div id="resultBox" class="result"></div>
    </div>

    <!-- 下面保持你原有的 <script> 部分即可 -->
</body>
</html>
