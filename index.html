<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>手机号状态查询</title>
    <style>
        /* 这里的 CSS 就是你之前提供并美化过的样式 */
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 350px;
        }

        h2 { color: #333; margin-bottom: 1.5rem; }

        input[type="text"] {
            width: 80%;
            padding: 10px;
            margin-bottom: 1rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            outline: none;
        }

        button {
            background-color: #5c67f2;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover { background-color: #4a54e1; }

        .result {
            margin-top: 1.5rem;
            padding: 10px;
            border-radius: 4px;
            display: none; /* 默认隐藏 */
        }

        .ok { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .no { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <h2>手机号查询系统</h2>
    <input type="text" id="phoneInput" placeholder="请输入手机号">
    <br>
    <button onclick="checkPhone()">点击查询</button>

    <!-- 结果显示区域 -->
    <div id="resultBox" class="result"></div>
</div>

<script>
    // 模拟数据库：这里存放你想要“在库”的号码
    const database =  ["13800000001","13800000002","13800000003","13800000004","13800000005","13800000006","13800000007","13800000008","13800000009","13800000010","13800000011","13800000012","13800000013","13800000014","13800000015","13800000016","13800000017","13800000018","13800000019","13800000020","13800000021","13800000022","13800000023","13800000024","13800000025","13800000026","13800000027","13800000028","13800000029","13800000030","13800000031","13800000032","13800000033","13800000034","13800000035","13800000036","13800000037","13800000038","13800000039","13800000040","13800000041","13800000042","13800000043","13800000044","13800000045","13800000046","13800000047","13800000048","13800000049","13800000050","13800000051","13800000052","13800000053","13800000054","13800000055","13800000056","13800000057","13800000058","13800000059","13800000060","13800000061","13800000062","13800000063","13800000064","13800000065","13800000066","13800000067","13800000068","13800000069","13800000070","13800000071","13800000072","13800000073","13800000074","13800000075","13800000076","13800000077","13800000078","13800000079","13800000080","13800000081","13800000082","13800000083","13800000084","13800000085","13800000086","13800000087","13800000088","13800000089","13800000090","13800000091","13800000092","13800000093","13800000094","13800000095","13800000096","13800000097","13800000098","13800000099","13800000100"];
      
         function checkPhone() {
        const input = document.getElementById('phoneInput').value.trim();
        const resultBox = document.getElementById('resultBox');

        if (input === "") {
            alert("请输入号码！");
            return;
        }

        resultBox.style.display = "block";

        // 判断逻辑
        if (database.includes(input)) {
            resultBox.className = "result ok";
            resultBox.innerHTML = `号码 ${input} <br> <b>在库 ✅</b>`;
        } else {
            resultBox.className = "result no";
            resultBox.innerHTML = `号码 ${input} <br> <b>未找到 ❌</b>`;
        }
    }


</body>
</html>
