<script>
    /**
     * 1. 粘贴号码
     */
    const rawData = `
        在这里粘贴上面的100个号码...
    `;

    // 优化：自动清洗数据。移除逗号、处理空格和换行，并使用 Set 去重提高查询效率
    const database = new Set(
        rawData.replace(/,/g, ' ') // 把逗号换成空格
               .trim()
               .split(/\s+/)        // 按空格/换行拆分
    );

    function checkPhone() {
        const inputField = document.getElementById('phoneInput');
        const input = inputField.value.trim();
        const resultBox = document.getElementById('resultBox');

        // 校验输入格式（简单的11位数字校验）
        if (!/^\d{11}$/.test(input)) {
            alert("请输入正确的11位手机号码");
            return;
        }

        resultBox.style.display = "block";

        // 使用 Set.has() 查询速度极快
        if (database.has(input)) {
            resultBox.className = "result ok";
            resultBox.innerHTML = `<span class="phone-display">查询号码：${input}</span>✅ 该号码已在白名单库中`;
        } else {
            resultBox.className = "result no";
            resultBox.innerHTML = `<span class="phone-display">查询号码：${input}</span>❌ 该号码不在库中，请核对`;
        }
    }

    document.getElementById('phoneInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') checkPhone();
    });
</script>
