<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>号码查询系统</title>
    <style>
        /* 1. 现代化背景：流体渐变效果 */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            min-height: 100vh; 
            margin: 0;
            padding-top: 120px;
            /* 这种渐变非常有高级感 */
            background-color: #f3f4f7;
            background-image: 
                radial-gradient(at 0% 0%, rgba(161, 196, 253, 0.5) 0, transparent 50%), 
                radial-gradient(at 100% 100%, rgba(194, 233, 251, 0.5) 0, transparent 50%),
                radial-gradient(at 100% 0%, rgba(255, 182, 193, 0.3) 0, transparent 50%);
            background-attachment: fixed;
        }

        /* 2. 容器：毛玻璃质感 */
        .search-container { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(15px); /* 模糊背后背景 */
            -webkit-backdrop-filter: blur(15px);
            padding: 45px; 
            border-radius: 24px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.08); 
            text-align: center;
            width: 90%;
            max-width: 450px;
            border: 1px solid rgba(255,255,255,0.5);
        }

        h2 { 
            margin-top: 0;
            margin-bottom: 30px;
            color: #2d3436;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* 横向排列布局 */
        .input-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        input { 
            flex: 1;
            padding: 14px 18px; 
            border: 2px solid transparent; 
            background: #fff;
            border-radius: 12px; 
            outline: none; 
            font-size: 16px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            transition: all 0.3s ease;
        }

        input:focus { 
            border-color: #007bff; 
            box-shadow: 0 4px 15px rgba(0,123,255,0.15);
        }

        button { 
            padding: 14px 28px; 
            background: linear-gradient(135deg, #007bff 0%, #00c6ff 100%);
            color: white; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: 600;
            transition: all 0.3s;
            white-space: nowrap;
            box-shadow: 0 8px 20px rgba(0,123,255,0.25);
        }

        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,123,255,0.35);
        }

        button:active { transform: translateY(0); }

        /* 查询结果动效 */
        .result { 
            margin-top: 30px; 
            padding: 18px; 
            border-radius: 14px; 
            display: none; 
            font-size: 16px;
            font-weight: 500;
            animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ok { background: #e3f9e5; color: #1f7a2a; border: 1px solid #b7ebbe; }
        .no { background: #fff1f0; color: #cf1322; border: 1px solid #ffa39e; }
        .phone-display { display: block; font-size: 14px; opacity: 0.8; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="search-container">
        <h2>号码查询系统</h2>
        <div class="input-row">
            <!-- 优化：自动弹出数字键盘 -->
            <input type="tel" id="phoneInput" placeholder="请输入手机号" maxlength="11">
            <button onclick="checkPhone()">立即查询</button>
        </div>
        <div id="resultBox" class="result"></div>
    </div>

<script>
    /**
     * 1. 在下面这个反引号 `` 之间粘贴你的号码
     * 无论是一行一个，还是用空格隔开，程序都会自动处理
     */
    const rawData = `
13800138000, 13912345678, 15022334455, 18611112222, 13199887766, 15855443322, 17700009999, 13322110044, 19966554433, 13788776655,13244556677, 15166778899, 18533221100, 13011223344, 15944556677, 18877889900, 17655443322, 13411223344, 15266778899, 13588990011,13611223344, 15544556677, 18233445566, 13077889900, 15666778899, 18722334455, 17311223344, 13866778899, 15000112233, 13944556677,13122334455, 15877889900, 18655667788, 13344556677, 19911223344, 13733445566, 13266778899, 15111223344, 18588990011, 13044556677,15922334455, 18833445566, 17611223344, 13466778899, 15200112233, 13544556677, 13688990011, 15511223344, 18277889900, 13033445566,15611223344, 18788990011, 17355667788, 13811223344, 15066778899, 13900112233, 13166778899, 15811223344, 18677889900, 13388990011,19944556677, 13700112233, 13211223344, 15177889900, 18555667788, 13088990011, 15977889900, 18811223344, 17688990011, 13444556677,15222334455, 13511223344, 13677889900, 15588990011, 18211223344, 13066778899, 15644556677, 18755667788, 17388990011, 13833445566,15088990011, 13966778899, 13111223344, 15833445566, 18622334455, 13355667788, 19977889900, 13755667788, 13288990011, 15144556677,18511223344, 13055667788, 15911223344, 18888990011, 17644556677, 13422334455, 15288990011, 13577889900, 13633445566, 15522334455
    `;

    // 自动将文本转换为可搜索的数组
    const database = rawData.trim().split(/\s+/);

    function checkPhone() {
        const inputField = document.getElementById('phoneInput');
        const input = inputField.value.trim();
        const resultBox = document.getElementById('resultBox');

        if (input === "") {
            alert("请输入要查询的号码");
            return;
        }

        resultBox.style.display = "block";

        if (database.includes(input)) {
            resultBox.className = "result ok";
            resultBox.innerHTML = `<span class="phone-display">查询号码：${input}</span>✅ 该号码在库中`;
        } else {
            resultBox.className = "result no";
            resultBox.innerHTML = `<span class="phone-display">查询号码：${input}</span>❌ 未找到该号码`;
        }
    }

    // 回车键支持
    document.getElementById('phoneInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') checkPhone();
    });
</script>

</body>
</html>
