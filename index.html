<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>号码查询系统</title>
    <style>
        /* 1. 现代化背景：流体渐变效果 */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            min-height: 100vh; 
            margin: 0;
            padding-top: 120px;
            /* 这种渐变非常有高级感 */
            background-color: #f3f4f7;
            background-image: 
                radial-gradient(at 0% 0%, rgba(161, 196, 253, 0.5) 0, transparent 50%), 
                radial-gradient(at 100% 100%, rgba(194, 233, 251, 0.5) 0, transparent 50%),
                radial-gradient(at 100% 0%, rgba(255, 182, 193, 0.3) 0, transparent 50%);
            background-attachment: fixed;
        }

        /* 2. 容器：毛玻璃质感 */
        .search-container { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(15px); /* 模糊背后背景 */
            -webkit-backdrop-filter: blur(15px);
            padding: 45px; 
            border-radius: 24px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.08); 
            text-align: center;
            width: 90%;
            max-width: 450px;
            border: 1px solid rgba(255,255,255,0.5);
        }

        h2 { 
            margin-top: 0;
            margin-bottom: 30px;
            color: #2d3436;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* 横向排列布局 */
        .input-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        input { 
            flex: 1;
            padding: 14px 18px; 
            border: 2px solid transparent; 
            background: #fff;
            border-radius: 12px; 
            outline: none; 
            font-size: 16px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            transition: all 0.3s ease;
        }

        input:focus { 
            border-color: #007bff; 
            box-shadow: 0 4px 15px rgba(0,123,255,0.15);
        }

        button { 
            padding: 14px 28px; 
            background: linear-gradient(135deg, #007bff 0%, #00c6ff 100%);
            color: white; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: 600;
            transition: all 0.3s;
            white-space: nowrap;
            box-shadow: 0 8px 20px rgba(0,123,255,0.25);
        }

        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,123,255,0.35);
        }

        button:active { transform: translateY(0); }

        /* 查询结果动效 */
        .result { 
            margin-top: 30px; 
            padding: 18px; 
            border-radius: 14px; 
            display: none; 
            font-size: 16px;
            font-weight: 500;
            animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ok { background: #e3f9e5; color: #1f7a2a; border: 1px solid #b7ebbe; }
        .no { background: #fff1f0; color: #cf1322; border: 1px solid #ffa39e; }
        .phone-display { display: block; font-size: 14px; opacity: 0.8; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="search-container">
        <h2>号码查询系统</h2>
        <div class="input-row">
            <!-- 优化：自动弹出数字键盘 -->
            <input type="tel" id="phoneInput" placeholder="请输入手机号" maxlength="11">
            <button onclick="checkPhone()">立即查询</button>
        </div>
        <div id="resultBox" class="result"></div>
    </div>

<script>
    /**
     * 1. 在下面这个反引号 `` 之间粘贴你的号码
     * 无论是一行一个，还是用空格隔开，程序都会自动处理
     */
    const rawData = `
13800000001
13800000002
15912345678
18888888888
    `;

    // 自动将文本转换为可搜索的数组
    const database = rawData.trim().split(/\s+/);

    function checkPhone() {
        const inputField = document.getElementById('phoneInput');
        const input = inputField.value.trim();
        const resultBox = document.getElementById('resultBox');

        if (input === "") {
            alert("请输入要查询的号码");
            return;
        }

        resultBox.style.display = "block";

        if (database.includes(input)) {
            resultBox.className = "result ok";
            resultBox.innerHTML = `<span class="phone-display">查询号码：${input}</span>✅ 该号码在库中`;
        } else {
            resultBox.className = "result no";
            resultBox.innerHTML = `<span class="phone-display">查询号码：${input}</span>❌ 未找到该号码`;
        }
    }

    // 回车键支持
    document.getElementById('phoneInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') checkPhone();
    });
</script>

</body>
</html>
