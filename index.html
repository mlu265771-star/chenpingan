<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>号码查询系统 - 现代化 UI</title>
    <style>
        /* 1. 基础样式重置与背景优化 */
        body { 
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; 
            margin: 0;
            display: flex; 
            justify-content: center;
            align-items: center; 
            min-height: 100vh;
            /* 使用更柔和的渐变背景 */
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        /* 2. 容器卡片设计 */
        .search-container { 
            background: white; 
            padding: 40px; 
            border-radius: 20px; 
            /* 更有层次感的阴影 */
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            text-align: center; 
            width: 90%;
            max-width: 400px;
            transition: transform 0.3s ease;
        }
        
        .search-container:hover {
            transform: translateY(-5px);
        }

        h2 {
            color: #333;
            margin-bottom: 25px;
            font-weight: 600;
        }

        /* 3. 输入框和按钮组设计 */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input { 
            padding: 14px 20px; 
            border: 2px solid #eee; 
            border-radius: 12px; 
            outline: none; 
            font-size: 16px; 
            transition: all 0.3s;
        }

        input:focus {
            border-color: #4facfe;
            box-shadow: 0 0 8px rgba(79, 172, 254, 0.2);
        }

        button { 
            padding: 14px; 
            background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
            color: white; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold;
            transition: opacity 0.3s;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);
        }

        button:hover { 
            opacity: 0.9;
        }

        button:active {
            transform: scale(0.98);
        }

        /* 4. 结果展示框优化 */
        .result { 
            margin-top: 25px; 
            padding: 20px; 
            border-radius: 12px; 
            display: none; 
            font-weight: 500; 
            line-height: 1.6;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ok { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        .no { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
        
        .phone-num { font-size: 1.1em; color: #333; margin-bottom: 5px; display: block; }
    </style>
</head>
<body>

    <div class="search-container">
        <h2>号码查询系统</h2>
        <div class="input-group">
            <input type="text" id="phoneInput" placeholder="请输入手机号" maxlength="11">
            <button onclick="checkPhone()">立即查询</button>
        </div>
        <div id="resultBox" class="result"></div>
    </div>

<script>
    // 数据库（保持不变）
    const database = ["13800000001", "13800000010"]; // 示例缩减，你可以继续用你的长列表

    function checkPhone() {
        const input = document.getElementById('phoneInput').value.trim();
        const resultBox = document.getElementById('resultBox');

        if (input === "") {
            alert("请输入要查询的号码");
            return;
        }

        resultBox.style.display = "block";

        if (database.includes(input)) {
            resultBox.className = "result ok";
            resultBox.innerHTML = `<span class="phone-num">号码：${input}</span> ✅ 该号码在库中`;
        } else {
            resultBox.className = "result no";
            resultBox.innerHTML = `<span class="phone-num">号码：${input}</span> ❌ 未找到该号码`;
        }
    }

    document.getElementById('phoneInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') checkPhone();
    });
</script>

</body>
</html>
